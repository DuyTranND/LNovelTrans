name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-backend:
    name: Backend Tests (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATA_DIR: /tmp/ci_data
      PYTHONUNBUFFERED: "1"
      GEMINI_API_KEY: ""
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run backend tests with pytest
        run: |
          mkdir -p /tmp/ci_data /tmp/pytest_ci_tmp
          pytest backend/tests -v --basetemp=/tmp/pytest_ci_tmp

  test-frontend:
    name: Frontend Test & Build (Node 22, pnpm 11.19)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up pnpm 11.19
        uses: pnpm/action-setup@v4
        with:
          version: "11.19.0"

      - name: Install frontend dependencies (frozen lockfile)
        run: |
          cd frontend
          pnpm install --frozen-lockfile

      - name: Run frontend tests
        run: |
          cd frontend
          pnpm test

      - name: Build frontend production bundle
        run: |
          cd frontend
          pnpm build

  build-docker:
    name: Docker Image Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify fonts present
        run: |
          test -d fonts
          test -f fonts/NotoSans-Regular.ttf
          test -f fonts/NotoSansKR-Regular.ttf

      - name: Build Docker image
        run: |
          docker build -t tram-dich:ci .

      - name: Smoke check Docker runtime and privilege drop
        run: |
          docker run --rm tram-dich:ci python -c "import backend.app.main; print('Container runtime OK')"
