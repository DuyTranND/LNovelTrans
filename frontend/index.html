<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trạm Dịch - Không gian làm việc dịch thuật EPUB</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('app-theme');
          var savedLang = localStorage.getItem('app-language');
          var lang = (savedLang === 'en') ? 'en' : 'vi';
          document.documentElement.lang = lang;
          
          var theme = savedTheme;
          if (theme !== 'light' && theme !== 'dark') theme = 'system';
          var actualTheme = theme;
          if (theme === 'system') {
            actualTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', actualTheme);
          document.documentElement.style.colorScheme = actualTheme;
        } catch (e) {
          var actualTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', actualTheme);
          document.documentElement.style.colorScheme = actualTheme;
          document.documentElement.lang = 'vi';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
